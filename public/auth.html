<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="stylesheet" href="/public/css/global.css">
  <title>Authentication - DuskCoffee</title>
</head>
<body>

  <button id="theme-toggle" class="theme-toggle-btn">
    <span id="theme-icon">☀️</span> <span id="theme-text"></span>
  </button>

  <main class="auth-container">
    
    <!-- ================= SIGN IN FORM ================= -->
    <form id="login-form" class="auth-form" action="log-admin.php" method="POST">
      <div class="auth-header">
        <h2>Sign In</h2>
        <p>Enter your email and password to sign in!</p>
      </div>

      <button type="button" class="btn-google" id="btn-google-login">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.01C2.47 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.87 10.8c-.18-.53-.28-1.1-.28-1.8s.1-1.27.28-1.8L.97 4.99C.35 6.22 0 7.57 0 9s.35 2.78.97 4.01l2.9-2.21z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.47 2.02.97 4.99l2.9 2.21C4.59 5.15 6.62 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="divider"><span>or</span></div>

      <div class="form-group">
        <label for="login-email">Email*</label>
        <input type="email" id="login-email" name="email" placeholder="mail@simple.com" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password*</label>
        <div class="password-wrapper">
          <input type="password" id="login-password" name="password" placeholder="Min. 8 characters" required>
          <button type="button" class="toggle-password" data-target="login-password" title="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-label" for="remember">
          <input type="checkbox" id="remember" name="remember" value="1">
          Keep me logged in
        </label>
        <a id="forgot-password" href="#">Forgot Password?</a>
      </div>

      <button type="submit" name="login" class="btn-primary">Log In</button>

      <p class="auth-footer-text">
        Not registered yet? <a id="to-register" href="#">Create an account</a>
      </p>
    </form>

    <!-- ================= SIGN UP FORM ================= -->
    <form id="register-form" class="auth-form hidden" action="log-admin.php" method="POST">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p>Join us today! Fill in your details below.</p>
      </div>

      <div class="form-group">
        <label for="reg-name">Full Name*</label>
        <input type="text" id="reg-name" name="name" placeholder="Full Name" required>
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address*</label>
        <input type="email" id="reg-email" name="email" placeholder="mail@simple.com" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Create New Password*</label>
        <div class="password-wrapper">
          <input type="password" id="reg-password" name="password" placeholder="New Password" required>
          <button type="button" class="toggle-password" data-target="reg-password" title="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-confirm-password">Re-Type Password*</label>
        <div class="password-wrapper">
          <input type="password" id="reg-confirm-password" name="confirm_password" placeholder="Confirm Password" required>
          <button type="button" class="toggle-password" data-target="reg-confirm-password" title="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="referral-source">Where did you hear about us?</label>
        <select id="referral-source" name="referral_source">
          <option value="" disabled selected>Select an option</option>
          <option value="youtube">YouTube</option>
          <option value="tiktok">TikTok</option>
          <option value="instagram">Instagram</option>
          <option value="facebook">Facebook</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-options">
        <label class="checkbox-label" for="terms">
          <input type="checkbox" id="terms" name="terms" required>
          I agree to the <a href="#">Terms and Conditions</a>
        </label>
      </div>

      <button type="submit" name="register" class="btn-primary">Register</button>

      <p class="auth-footer-text">
        Already have an account? <a id="to-login" href="#">Sign in</a>
      </p>
    </form>

  </main>

  <footer>
    <p>©2026 DuskCoffee. All Rights Reserved by <span>DuskCoffee</span> • Distributed by <span>ThemeWagon</span></p>
  </footer>

  <script>
    // 1. Toggle Login <-> Register Form
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const toRegisterLink = document.getElementById('to-register');
    const toLoginLink = document.getElementById('to-login');

    toRegisterLink.addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
    });

    toLoginLink.addEventListener('click', (e) => {
      e.preventDefault();
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });

    // 2. Show / Hide Password Toggle
    const togglePasswordButtons = document.querySelectorAll('.toggle-password');
    togglePasswordButtons.forEach(button => {
      button.addEventListener('click', () => {
        const targetId = button.getAttribute('data-target');
        const passwordInput = document.getElementById(targetId);
        
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          button.style.opacity = '0.5';
        } else {
          passwordInput.type = 'password';
          button.style.opacity = '1';
        }
      });
    });

    // 3. Toggle Dark / Light Theme (Orange Dark <-> Orange White)
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      
      const isLight = document.body.classList.contains('light-theme');
      themeIcon.textContent = isLight ? '🌙' : '☀️';
      themeText.textContent = isLight ? 'Dark Mode' : 'Light Mode';
    });
  </script>

</body>
</html>
